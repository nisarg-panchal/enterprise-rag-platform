[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Production-oriented enterprise RAG platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic-settings>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=1.1,<2.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.12,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
